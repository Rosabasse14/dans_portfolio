<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Form</title>
</head>
<body>
    <h1>Update Info</h1>
    <form action="portfolio.html">
        <label for="Username"> New name:</label>
        <input type="text" name="Username" placeholder="Enter your Username" required>
        <br>
        <label for="newage"> Age:</label>
        <input type="number" name="newage" placeholder="Enter New Age:" required >
        <br>
        <label for="newpassword"> New Password:</label>
        <input type="password" name="newpassword" placeholder="Enter your New password" required maxlength="8">
        <br>
        <button>Save</button>
    </form>
    
</body>
</html>
